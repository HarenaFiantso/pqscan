name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: scripts/check-format.sh

  static-analysis:
    needs: format
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.downloads
          key: downloads-${{ hashFiles('tests/CMakeLists.txt', 'cmake/dependencies.cmake') }}
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install --yes cppcheck libssl-dev
      - run: cmake --preset debug
      - run: scripts/run-static-analysis.sh

  build-and-test:
    needs: static-analysis
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc }
          - { os: ubuntu-24.04, cc: clang }
          - { os: macos-15, cc: clang }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.downloads
          key: downloads-${{ hashFiles('tests/CMakeLists.txt', 'cmake/dependencies.cmake') }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libssl-dev
      - run: cmake --preset debug
      - run: cmake --build --preset debug --parallel
      - run: ctest --preset debug
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel
      - run: ctest --preset release

  report-schemas:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.downloads
          key: downloads-${{ hashFiles('tests/CMakeLists.txt', 'cmake/dependencies.cmake', 'cmake/report_schemas.cmake') }}
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install --yes libssl-dev
      - run: cmake --preset debug -DPQSCAN_CHECK_REPORT_SCHEMAS=ON
      - run: cmake --build --preset debug --parallel
      - run: ctest --preset debug -L schema

  fuzz:
    needs: build-and-test
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.downloads
          key: downloads-${{ hashFiles('tests/CMakeLists.txt', 'cmake/dependencies.cmake') }}
      - run: sudo apt-get update && sudo apt-get install --yes libssl-dev
      - run: cmake --preset fuzz
      - run: cmake --build --preset fuzz --parallel --target fuzz_elf_reader
      - run: scripts/run-fuzzer.sh elf_reader 120
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: build/fuzz-crashes/

  valgrind:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.downloads
          key: downloads-${{ hashFiles('tests/CMakeLists.txt', 'cmake/dependencies.cmake') }}
      - run: sudo apt-get update && sudo apt-get install --yes libssl-dev valgrind
      - run: cmake --preset valgrind
      - run: cmake --build --preset valgrind --parallel
      - run: ctest --preset valgrind

  # Runs the action in this repository the way a project would run it in its own.
  action:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Write a baseline, which accepts every finding
        id: write
        uses: ./
        with:
          paths: tests/fixtures/scan/findings
          args: --write-baseline ${{ runner.temp }}/baseline.json
          upload-sarif: "false"
      - name: Diff against the baseline, which finds nothing new
        id: same
        uses: ./
        with:
          paths: tests/fixtures/scan/findings
          baseline: ${{ runner.temp }}/baseline.json
          upload-sarif: "false"
      - name: Drop one finding from the baseline
        run: >-
          jq '.findings |= map(select(.path != "tests/fixtures/scan/findings/rsa.c"))'
          "$RUNNER_TEMP/baseline.json" > "$RUNNER_TEMP/partial.json"
      # Code scanning still gets every finding: only the gate goes by the baseline.
      - name: Diff against the smaller baseline, which must fail the job
        id: new
        continue-on-error: true
        uses: ./
        with:
          paths: tests/fixtures/scan/findings
          baseline: ${{ runner.temp }}/partial.json
          sarif-file: new.sarif
          upload-sarif: "false"
      - name: Check what each run did
        env:
          WRITE_EXIT: ${{ steps.write.outputs.exit-code }}
          SAME_EXIT: ${{ steps.same.outputs.exit-code }}
          NEW_EXIT: ${{ steps.new.outputs.exit-code }}
          NEW_OUTCOME: ${{ steps.new.outcome }}
        run: |
          test "$WRITE_EXIT" = 0
          test "$SAME_EXIT" = 0
          test "$NEW_EXIT" = 1
          test "$NEW_OUTCOME" = failure
          test "$(jq '.runs[0].results | length' new.sarif)" = 57
