name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: scripts/check-format.sh

  static-analysis:
    needs: format
    runs-on: ubuntu-24.04
    env:
      CC: clang
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.downloads
          key: downloads-${{ hashFiles('tests/CMakeLists.txt') }}
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install --yes cppcheck
      - run: cmake --preset debug
      - run: scripts/run-static-analysis.sh

  build-and-test:
    needs: static-analysis
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, cc: gcc }
          - { os: ubuntu-24.04, cc: clang }
          - { os: macos-15, cc: clang }
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.downloads
          key: downloads-${{ hashFiles('tests/CMakeLists.txt') }}
      - run: cmake --preset debug
      - run: cmake --build --preset debug --parallel
      - run: ctest --preset debug
      - run: cmake --preset release
      - run: cmake --build --preset release --parallel
      - run: ctest --preset release

  valgrind:
    needs: build-and-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/.downloads
          key: downloads-${{ hashFiles('tests/CMakeLists.txt') }}
      - run: sudo apt-get update && sudo apt-get install --yes valgrind
      - run: cmake --preset valgrind
      - run: cmake --build --preset valgrind --parallel
      - run: ctest --preset valgrind
